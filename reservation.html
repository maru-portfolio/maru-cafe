<!DOCTYPE html>
<html>
<head>
<title>予約受付</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header class="header">
<h1>MARU CAFE　予約受付</h1>
</header>
<p>ご予約希望の人数とお日にちを入力して送信してください。<br>
お名前は代表者の方のお名前をご入力ください。</p>
<section class="reservation-form">
<p>お名前</p>
<input type="text">
<p>予約日</p>
<input type="date">
<p>予約人数</p>
<input type="number">
<p>お問い合わせ</p>
<textarea placeholder="わんちゃん、猫ちゃん同伴の方はこちらでお知らせください。テラス席をご用意します。"></textarea>
<button>予約する</button>
</section>
<p>ご予約完了後、◆予約完了メールをお送りしますのでご確認ください。</p>
<p>☕ご来店、お待ちしております☕</p>
<div class="reservation-images">
<img src="terrace.jpg" alt="テラス席" class="reservation-image">
<img src="interior.jpg" alt="MARU CAFEの店内"class="reservation-image">
<img src="cafe.jpg" alt="MARU CAFEの店内" class="reservation-image">
</div>
</div>
</body>
</html>
